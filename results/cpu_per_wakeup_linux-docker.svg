<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-label="Cost of watching idle pipes (linux-docker)">
<style>text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{fill:#e1e0d9}.axis{fill:#c3c2b7}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.ls1{stroke:#2a78d6}.ls2{stroke:#eb6834}.ls3{stroke:#1baf7a}.gridline{stroke:#e1e0d9}.baseline{stroke:#c3c2b7}.ring{stroke:#fcfcfb}@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.muted{fill:#898781}.grid{fill:#2c2c2a}.axis{fill:#383835}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.ls1{stroke:#3987e5}.ls2{stroke:#d95926}.ls3{stroke:#199e70}.gridline{stroke:#2c2c2a}.baseline{stroke:#383835}.ring{stroke:#1a1a19}}</style>
<rect class="surface" width="760" height="396" rx="8"/>
